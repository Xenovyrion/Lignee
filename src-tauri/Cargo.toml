[package]
name = "lignee"
version = "0.1.0"
description = "Lignée - pilotage de l'élevage pour Dofus 3.7"
authors = ["Xenovyrion"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "lignee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri           = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
