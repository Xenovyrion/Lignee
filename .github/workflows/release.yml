name: Release
on:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour automatiques (clé privée enregistrée en secret du dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lignée ${{ github.ref_name }}
          releaseBody: |
            Installeur Windows ci-dessous (.exe ou .msi).

            🔒 Compilé automatiquement par GitHub Actions à partir du code public de ce dépôt ([journal de compilation](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
          releaseDraft: false
          prerelease: false
      # Analyse VirusTotal des installeurs, liens ajoutés aux notes (seulement si la clé VT_API_KEY est enregistrée en secret).
      - id: vt
        uses: crazy-max/ghaction-virustotal@v5
        if: env.VT_API_KEY != ''
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      # La release est créée par ce workflow : les liens sont ajoutés aux notes ici (update_release_body ne marche que sur l'événement release).
      - if: steps.vt.outputs.analysis != ''
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ANALYSE: ${{ steps.vt.outputs.analysis }}
        run: |
          $liens = $env:ANALYSE -split ',' | ForEach-Object { $f, $u = $_ -split '=', 2; "- [$(Split-Path $f -Leaf)]($u)" }
          $corps = gh release view $env:TAG --json body -q .body
          "$corps`n`n🛡️ Analyse VirusTotal :`n$($liens -join "`n")" | Set-Content notes-vt.md -Encoding utf8
          gh release edit $env:TAG --notes-file notes-vt.md
